<style>
:root{--a:#ffc233;--t:#f2f2f2;--m:#8d8d8d;--r:#ff5a5f;--e:linear-gradient(145deg,#707070,#1a1a1a 45%,#4a4a4a);--gl:radial-gradient(ellipse at 50% 100%,rgba(255,194,51,.28),rgba(255,194,51,.09) 45%,transparent 70%);--d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#000;color:var(--t);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:10}
.bd,input,select,textarea{border:1px solid transparent;background:linear-gradient(#000,#000) padding-box,var(--e) border-box;border-radius:14px}
input,select,textarea{width:100%;color:var(--t);padding:11px;font:inherit;font-size:16px;outline:0}
textarea{min-height:76px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#000;padding:10px 12px 6px;border-bottom:1px solid #222}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
#bud{cursor:pointer;min-width:0}#bud small{display:block;color:var(--m);font-size:11px}
#bud strong{display:block;font:800 clamp(26px,8.4vw,36px)/1 var(--d);white-space:nowrap}
.pb{height:4px;background:#1b1b1b;border-radius:3px;margin:5px 0 2px;overflow:hidden}.pb i{display:block;height:100%}
h1{margin:4px 0 0;font:800 26px var(--d);text-align:center;letter-spacing:.5px}h1 b{color:var(--a)}
h2{font:800 28px var(--d);margin:6px 0 4px}h3{font:800 22px var(--d);margin:18px 12px 8px}
.cb{justify-self:end;margin-top:4px;padding:9px 15px;border-radius:12px;font:800 17px var(--d);cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;padding:7px 13px;border-radius:20px;color:var(--m);font-weight:600;font-size:13px;border:1px solid #2c2c2c;cursor:pointer}.tb.on{color:#000;background:var(--a);border-color:var(--a)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 96px}
.c{overflow:hidden;cursor:pointer}
.ph{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#1c1c1c,#000);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font:800 22px/1.1 var(--d);color:#d6d6d6;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ck,.hv,.mv{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.72);border:1px solid #555;color:#aaa;font-size:16px;cursor:pointer;flex:none}
.ph .ck{position:absolute;right:8px;bottom:8px}.ph .hv{position:absolute;right:8px;top:8px}
.ck.on{background:var(--a);color:#000;border-color:var(--a)}.hv.on{color:#ff5d7a;border-color:#ff5d7a}
.ci{padding:9px 11px 11px}.n{font-weight:700}.p{font:800 22px var(--d);color:var(--a)}.s{color:var(--m);font-size:12px;margin-top:2px}
.em{text-align:center;color:var(--m);padding:70px 24px;line-height:1.5}
.sm{margin:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.sm div{padding:11px 13px;border-radius:14px;border:1px solid #2a2a2a;color:var(--m);font-size:12px}.sm b{display:block;font:800 24px var(--d);color:var(--t)}
.rr{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:11px 13px}.rr>div:first-child{flex:1;min-width:0}.rt{font:800 22px var(--d)}.li{width:84px!important;padding:8px!important}
.sr{display:flex;gap:6px;align-items:center;padding:12px 12px 0;color:var(--m);font-size:13px}
.rl{padding:8px 12px}.rw{padding:12px;margin-bottom:10px}.rw.vs{opacity:.55}.rw input{margin-top:6px}
.rh{display:flex;align-items:center;gap:8px}.gr{flex:1;min-width:0}.nm{font:800 26px var(--d);color:var(--a);width:26px}
#m{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow-y:auto;background:var(--gl) no-repeat 50% 100%/150% 52%,#000;animation:hb 6s ease-in-out infinite;border-radius:22px 22px 0 0;padding:12px 14px calc(26px + env(safe-area-inset-bottom,0px));border-top:2px solid #505050}
.xb{position:absolute;right:0;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#1c1c1c;z-index:2;cursor:pointer}
.lb{color:var(--m);font-size:13px;margin:16px 0 6px}
.ch{display:inline-block;padding:7px 12px;margin:3px 5px 3px 0;border-radius:18px;border:1px solid #3a3a3a;color:#bbb;font-size:13px;cursor:pointer}.ch.on{background:var(--a);color:#000;border-color:var(--a);font-weight:700}
.ar{display:flex;gap:6px;margin-top:6px}.ar .bt{width:50px}
.bt{padding:12px;border-radius:12px;color:var(--t);font:inherit;font-weight:700;border:1px solid #3a3a3a;background:#000;width:100%;cursor:pointer}.bt.pr{background:var(--a);color:#000;border-color:var(--a)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pi{position:relative}.pi input{padding-right:32px}.pi i{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--a);font-weight:800}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin-top:4px}
.gi{flex:0 0 100%;scroll-snap-align:center;position:relative;height:52vh;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1c1c1c,#000);display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--m);cursor:pointer}
.gi img{width:100%;height:100%;object-fit:contain}.gi b{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.75);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.ft{font:800 28px var(--d);color:#ddd;padding:12px;text-align:center}
.lg{aspect-ratio:16/9;border-radius:16px;margin-top:6px;cursor:pointer}.st{font-size:30px;color:#444;margin-right:6px;cursor:pointer}.st.on{color:var(--a)}
#fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--a);color:#000;font-size:32px;display:flex;align-items:center;justify-content:center;z-index:6;cursor:pointer;box-shadow:0 0 0 3px #000,0 0 0 4px #555}
#ts{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none;max-width:90%;text-align:center}

#bud strong{font-family:"BT",var(--d);font-weight:400;font-synthesis:none}
.rb{flex-direction:column;align-items:flex-end;gap:5px}
h1{font-size:32px;margin-top:14px;transform:translateX(-14px)}
.dd{position:relative}
.dh{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;cursor:pointer;color:var(--t)}.dh b{color:var(--a);font-size:14px}
.dl{margin-top:6px;padding:6px;max-height:260px;overflow-y:auto;animation:fi .2s}
.ot{padding:10px 12px;border-radius:10px;cursor:pointer;color:#cfcfcf}.ot.on{background:var(--a);color:#000;font-weight:700}
.y{background:repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 6px),linear-gradient(160deg,#ffd45e,#e8a800)!important;color:#1b1400!important;border-color:#c98f00!important}
.y .ot{color:#2a2000}.y .ot.on{background:#1b1400;color:var(--a)}.y b{color:#1b1400!important}
.lst{position:sticky;bottom:10px;z-index:3;padding-top:14px;transition:transform .25s,opacity .25s}.lst.hide{transform:translateY(140%);opacity:0;pointer-events:none}
.hd{position:relative}
.qw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.qc{background:#000;padding:16px;text-align:center;width:100%;max-width:340px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.bl{display:inline-block;filter:blur(1.5px);letter-spacing:1px}.inc .pi input,.inc .li,.inc #bi{filter:blur(5px)}
@keyframes wave{0%,100%{transform:none;box-shadow:none}25%{transform:translateY(-16px) scale(1.1);box-shadow:0 12px 14px -3px rgba(255,194,51,.75)}55%{transform:translateY(9px);box-shadow:0 -10px 12px -4px rgba(255,194,51,.5)}80%{transform:translateY(-4px);box-shadow:0 6px 10px -4px rgba(255,194,51,.3)}}

.top{grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
h1{font-size:28px;margin-top:10px;transform:none;text-align:right}
#bud strong{font-size:clamp(34px,10.4vw,44px)}
#bud{transform-origin:left center}#bud.hit{animation:hit .4s ease-out}
@keyframes hit{0%{transform:none}30%{transform:scale(.9) translateY(4px)}60%{transform:scale(1.07)}100%{transform:none}}
.fl{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%)}
.hf{font-size:26px;color:#ff5d7a;animation:hrt .95s ease-out forwards}
@keyframes hrt{0%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-50%,calc(-50% - 24px)) scale(2.1)}45%{transform:translate(-50%,-50%) scale(1)}62%{transform:translate(-50%,calc(-50% - 10px)) scale(1.35)}78%{transform:translate(-50%,-50%) scale(1)}90%{transform:translate(-50%,calc(-50% - 3px)) scale(1.1)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.sx{overflow:visible}.sx line{stroke:var(--a);stroke-width:3;stroke-linecap:round;stroke-dasharray:14;stroke-dashoffset:14;animation:dw .55s ease-out forwards}
@keyframes dw{0%{stroke-dashoffset:14;opacity:1}60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.ck.spin{animation:spn .6s ease-out}
@keyframes spn{from{transform:perspective(160px) rotateY(0)}to{transform:perspective(160px) rotateY(-360deg)}}
.bp{font:400 38px/1 "FF","BT",var(--d);color:#ff3b30;white-space:nowrap;animation:bpk .85s ease-in forwards}
@keyframes bpk{0%{transform:translate(-50%,-110px) scale(.6);opacity:0}30%{transform:translate(-50%,0) scale(1.15);opacity:1}38%{transform:translate(-50%,7px) scale(.9)}70%{transform:translate(-50%,-4px) scale(1);opacity:1}100%{transform:translate(-50%,-36px) scale(.9);opacity:0}}
.c.sl{box-shadow:0 0 0 2px var(--a)}
.cfr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-top:4px}
.cfl,.cfr2{display:flex;flex-direction:column;gap:6px}.cfr2{align-items:flex-end}.cfl{align-items:flex-start}
.ya{background:var(--a)!important;color:#000!important;border-color:var(--a)!important}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 4px;border-bottom:1px solid #222;cursor:pointer}
.tg{flex:none;width:52px;height:30px;border-radius:15px;background:#3a3a3a;position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}

h1{margin-top:16px}
.c{position:relative}.c.nw{animation:flp .85s cubic-bezier(.2,.8,.2,1)}
.c.nw::after{content:"";position:absolute;inset:0;background:#1c1c1c;border-radius:inherit;pointer-events:none;animation:bkf .85s linear forwards}
@keyframes flp{0%{transform:perspective(700px) rotateY(180deg) scale(.2)}100%{transform:perspective(700px) rotateY(360deg) scale(1)}}
@keyframes bkf{0%,45%{opacity:1}55%,100%{opacity:0}}
.rd{background:var(--r)!important;color:#000!important;border-color:var(--r)!important}
.d2{position:relative;display:inline-block}.d2::before,.d2::after{content:"";position:absolute;top:-.05em;bottom:-.05em;width:.07em;background:currentColor}.d2::before{left:32%}.d2::after{left:58%}
body.gold{background:repeating-linear-gradient(135deg,rgba(255,194,51,.14) 0 2px,transparent 2px 8px),linear-gradient(180deg,#2e2200,#140d00 60%,#000)}
body.gold header{background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
#gx{position:fixed;inset:0;z-index:50}#gx canvas{position:absolute;inset:0;touch-action:none}
#gw{position:fixed;width:58px;height:58px;border-radius:50%;background:var(--a);color:#000;font-size:34px;display:flex;align-items:center;justify-content:center;z-index:51}#gw img{width:100%}
#gw.evo{animation:evo 2.2s ease-in-out forwards}
@keyframes evo{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.5) rotate(200deg)}55%{transform:scale(2) rotate(540deg);filter:brightness(3);box-shadow:0 0 70px 36px #fff}75%{transform:scale(2) rotate(720deg);filter:brightness(2.4);box-shadow:0 0 50px 20px #ffd45e}100%{transform:scale(1.5) rotate(720deg);filter:none;box-shadow:none}}
#gt{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font:400 54px "GWFF",var(--d);color:#f2f2f2;white-space:nowrap;opacity:0;z-index:52;pointer-events:none}#gt b{color:var(--a);font-weight:400}
#gxx{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:53;padding:6px 12px;font-size:12px;color:var(--m);border:1px solid #333;border-radius:14px;background:#000}
.gxin{animation:gxin 1.6s cubic-bezier(.2,.8,.2,1);transform-origin:50% 25%}
@keyframes gxin{from{transform:scale(.25);opacity:0}to{transform:none;opacity:1}}
.fwo{position:fixed;inset:0;z-index:60;pointer-events:none}.fwo canvas{position:absolute;inset:0}
.fwt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.82);padding:18px 22px;border-radius:18px;border:1px solid #555;max-width:80%;animation:up .4s,fo .5s 3.3s forwards}
.fwt b{display:block;font:800 26px var(--d);margin:4px 0}.fwt span{color:var(--m);font-size:13px}

.rvi{flex:none;width:44vw;max-width:260px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;position:relative;background:#111;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .15s;touch-action:pan-x}
.rvi img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.rvi i{position:absolute;left:8px;top:8px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:rgba(0,0,0,.65);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.rvi.hold{transform:scale(.96)}.rvi.lift{z-index:3;box-shadow:0 20px 32px -6px #000,0 0 0 2px var(--a)}
#cpw{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px}
.cpc{background:#000;padding:16px;text-align:center;width:100%;max-width:310px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.cpwh{position:relative;width:240px;height:240px;margin:0 auto;touch-action:none}.cpwh canvas{width:240px;height:240px;display:block}
.cpm{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #000;transform:translate(-50%,-50%);pointer-events:none}
.mcb{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important}
.pcb{width:32px;height:32px;border-radius:50%;background:#000;border:2px solid #666;cursor:pointer;flex:none}
.lcm{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px;margin-top:8px}.lcm .esw{width:30px;height:30px}.lcm .bt{width:auto;flex:none}
.pen{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#000;color:#fff;border:1px solid #555;font-size:16px;cursor:pointer;flex:none}
.cri{font-style:normal;font-weight:800;color:var(--r);font-size:22px;margin-left:6px}.rd .cri{color:#000}
#evw{touch-action:none}
.rpb{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:#000;color:var(--r);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;font-style:normal}
#lpair{position:fixed;left:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:6;margin:0}#lpair .bt{width:54px;height:46px;padding:0;font-size:22px}
#lbar{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:10px}#lbar .bt{flex:1;margin:0;padding:14px;font-size:16px}
body.ldm #fab{display:none}
.c.rd .p{color:#000}.c.rd .n{color:#000}.c.rd .s{color:#3a0a0c}
#lpair[hidden],#lbar[hidden]{display:none!important}
